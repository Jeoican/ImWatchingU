services:
  socialwatch:
    build:
      context: .
      dockerfile: Dockerfile
    image: socialwatch:latest
    container_name: socialwatch
    restart: unless-stopped

    ports:
      # 左边是宿主机端口，改成 8899:8080 可避免与本机其它服务冲突
      - "8080:8080"

    volumes:
      # 配置与数据都挂出来：改配置不用重建镜像，历史数据不随容器销毁
      - ./config.yaml:/app/config.yaml
      - ./data:/app/data

    environment:
      TZ: Asia/Shanghai
      # 容器内用 Playwright 自带 chromium
      SW_BROWSER_CHANNEL: ""
      SW_BROWSER_NO_SANDBOX: "1"
      # 容器与宿主机必须用不同的浏览器 profile 目录：
      # Linux Chromium 会覆写 macOS 的 profile（cookie 加密格式不同），
      # 共用会导致登录态被清空、两边互相破坏。
      SW_PROFILE_ROOT: /app/data/browser_container
      PORT: "8080"
      HOST: "0.0.0.0"

    # chromium 吃内存，给足资源；限制 CPU 保证不影响宿主机其他负载
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          memory: 512M

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/api/health',timeout=8).status==200 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
